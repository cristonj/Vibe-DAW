name: iOS Store Screenshots
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Standard macOS runner
        type: choice
        options: [macos-26, macos-26-intel]
        default: macos-26
permissions:
  contents: read
concurrency:
  group: ios-screenshots
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Generate native project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        run: pod install --project-directory=ios
      - name: Compile standalone Simulator app
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath simulator-build CODE_SIGNING_ALLOWED=NO ARCHS="$(uname -m)" > xcodebuild.log 2>&1 || { tail -100 xcodebuild.log; exit 1; }
          APP=$(find simulator-build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          ditto -c -k --sequesterRsrc --keepParent "$APP" simulator-app.zip
      - name: Preserve compiled Simulator app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator-app
          path: mobile/simulator-app.zip
          retention-days: 3
      - name: Preserve native compile log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator-build-log
          path: mobile/xcodebuild.log
          retention-days: 14
  capture:
    needs: compile
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-simulator-app
          path: mobile
      - name: Unpack Simulator app
        run: |
          mkdir -p simulator-build/Build/Products/Release-iphonesimulator
          ditto -x -k simulator-app.zip simulator-build/Build/Products/Release-iphonesimulator
      - name: Capture on a fresh Simulator host
        run: node scripts/capture-ios-screenshots.mjs ${{ matrix.device }}
      - name: Preserve original screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-store-screenshots-${{ matrix.device }}
          path: mobile/screenshots/*
          retention-days: 30
